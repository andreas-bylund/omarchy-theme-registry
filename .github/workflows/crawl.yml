name: Crawl for new themes

on:
  schedule:
    - cron: '0 6 * * *' # daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max themes to add in one run'
        type: string
        default: '50'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  # Daily means a crawl can land while the last one is still unreviewed. The
  # crawler only knows about themes that are on main, so it would propose the
  # same batch again in a second PR, every day, until the first one merges.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Not filtered by label: the label may not exist yet in a fresh repo,
          # and `gh pr list --label` fails outright on an unknown one.
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("crawl/"))] | .[0].number')

          if [[ -n "$open" && "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            echo "PR #$open is still open — nothing to propose until it lands."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/crawl.js --write --limit "${{ inputs.limit || '50' }}"

      - name: Open a PR for whatever it found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain themes/)" ]]; then
            echo "No new themes."
            exit 0
          fi

          count=$(git status --porcelain themes/ | wc -l)
          branch="crawl/$(date +%Y-%m-%d)"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add themes/
          git commit -m "crawl: add $count theme(s)"
          git push --force-with-lease origin "$branch"

          # Labels don't exist in a fresh repo, and gh pr create fails outright on
          # an unknown one. Create them up front instead of losing the PR to it.
          gh label create crawl --color 0e8a16 \
            --description "Proposed by the theme crawler" --force
          gh label create needs-review --color fbca04 \
            --description "Ships exec directives or scripts — look before merging" --force

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file crawl-report.md
          else
            gh pr create \
              --title "crawl: add $count theme(s)" \
              --body-file crawl-report.md \
              --label crawl \
              --base main --head "$branch"
          fi
