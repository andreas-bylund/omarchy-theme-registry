name: Build index

on:
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'src/**'
      - '.github/workflows/build.yml'
  # Nightly, so stars and upstream commits stay fresh without anyone merging.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild every theme, ignoring the cache'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rolling cache: only themes whose upstream HEAD moved get re-cloned.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: registry-build-${{ github.run_id }}
          restore-keys: registry-build-

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/build.js --out dist --cache .cache \
            ${{ inputs.force && '--force' || '' }}

      - name: Summarize
        run: |
          {
            echo "### Registry index"
            echo
            echo "- themes: $(jq '.count' dist/index.json)"
            echo "- generated: $(jq -r '.generated_at' dist/index.json)"
            echo "- index size: $(du -h dist/index.json | cut -f1)"
            echo "- thumbnails: $(ls dist/thumbs | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
